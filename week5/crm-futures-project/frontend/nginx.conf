server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Обработка статических файлов и роутинга React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API запросов на бэкенд
    location /api {
        # 'backend' - имя сервиса в docker-compose.yml
        proxy_pass http://backend:5000;

        # Стандартные заголовки для проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Опционально: Настройки таймаутов, если бэкенд долго отвечает
        # proxy_connect_timeout       60s;
        # proxy_send_timeout          60s;
        # proxy_read_timeout          60s;
        # send_timeout                60s;
    }

    # Убрали блок error_page для простоты
}
